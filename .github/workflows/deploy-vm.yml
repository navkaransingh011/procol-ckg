# Deploys procol-ckg to the GCP VM on every merge to main.
# Replaces the manual loop: push -> ssh -> git pull -> npm build -> migrate -> restart.
#
# Auth: Workload Identity Federation (no stored keys) + IAP tunnel (no public port 22).
# Setup steps are in docs/CI_DEPLOY.md. Required repo secrets/variables:
#   secret  GCP_WIF_PROVIDER    projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   secret  GCP_SERVICE_ACCOUNT ckg-deployer@<project>.iam.gserviceaccount.com
#   var     GCP_PROJECT         procol-xxxx
#   var     VM_NAME             procol-ckg
#   var     VM_ZONE             asia-south1-c
#   var     VM_REPO_DIR         /home/<repo-owner>/procol-ckg (absolute; $HOME resolves to the
#                               OS-Login deployer account, not the repo owner, over this SSH hop)
name: Deploy to VM

on:
  push:
    branches: [main]
    # Docs and the bootstrap dump do not change what runs on the VM.
    paths-ignore: ["db/dump/**", "docs/**", "**/*.md", "eval/out/**"]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required to mint the WIF token

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      # The VM pulls this exact commit and rebuilds. --tunnel-through-iap means port 22
      # never has to be open to the internet.
      # $HOME here is the OS-Login-provisioned home for the deployer service account, not
      # the repo owner's -- CKG_REPO_DIR pins vm-deploy.sh to where the repo actually lives.
      - name: Deploy over IAP
        run: |
          gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone "${{ vars.VM_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command "bash -lc 'CKG_REPO_DIR=${{ vars.VM_REPO_DIR }} bash ${{ vars.VM_REPO_DIR }}/deploy/vm-deploy.sh ${{ github.sha }}'"

      - name: Report
        if: always()
        run: echo "deployed ${{ github.sha }} to ${{ vars.VM_NAME }} (${{ vars.VM_ZONE }})" >> "$GITHUB_STEP_SUMMARY"
